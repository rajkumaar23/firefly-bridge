# config.example.yaml — Comprehensive reference showing all DSL options
#
# Environment variables can be referenced anywhere in values: ${ENV:VAR_NAME}
# Secret references: op://vault/item/field (requires secrets.onepassword)
#                    bw://item/field        (requires secrets.bitwarden)
# Template functions in send_keys / set_value values:
#   {{ Today "format" }}           — current date
#   {{ SubtractDays N "format" }}  — date N days in the past

# ── Firefly III connection ────────────────────────────────────────────────────
firefly:
  host: "${ENV:FIREFLY_HOST}"   # valid HTTP/HTTPS URL; or literal: "https://firefly.example.com"
  token: "${ENV:FIREFLY_TOKEN}" # JWT Personal Access Token from Firefly → Profile → OAuth

# ── Secret providers (optional) ──────────────────────────────────────────────
# When configured, any send_keys / set_value `value` may reference a secret by
# URI instead of hardcoding it. Configure either or both providers; each is
# selected by its URI scheme (op:// → 1Password, bw:// → Bitwarden).
secrets:
  onepassword:
    token: "${ENV:OP_SERVICE_ACCOUNT_TOKEN}" # or literal: "ops_your_service_account_token"

  # Bitwarden Password Manager, read via the `bw` CLI (must be installed).
  # One-time setup:  bw login  &&  export BW_SESSION=$(bw unlock --raw)
  # Reference items as bw://item/field, e.g. bw://example-bank/username.
  bitwarden:
    session: "${ENV:BW_SESSION}"    # unlock key from `bw unlock`; omit to use ambient BW_SESSION
    # server_url: "https://vault.bitwarden.eu"  # optional: EU cloud / self-hosted / Vaultwarden
    # appdata_dir: "/data/bw"                    # optional: isolate the CLI's data directory
    # bw_path: "/usr/local/bin/bw"               # optional: path to the bw binary (default: bw on PATH)

# ── AI categorization (optional) ─────────────────────────────────────────────
# When enabled, each new transaction is assigned a category and/or budget before
# it is uploaded, using any OpenAI-compatible chat endpoint (llama.cpp, Ollama,
# LocalAI, OpenAI, …). It is designed to COMPLEMENT Firefly's rule engine, not
# fight it:
#   • It never overwrites a value already set (e.g. a category parsed from CSV).
#   • It only picks from categories/budgets that already exist in Firefly — it
#     never invents new ones.
#   • It first reuses whatever category/budget similar past transactions already
#     carry (e.g. assigned by a Firefly rule) and only asks the model when there
#     is no clear precedent — so existing rules win.
# Tip for small local models (e.g. qwen on a Jetson): keep your Firefly category
# and budget lists modest and max_examples low to stay within the context window.
# Reasoning is disabled on every request, so thinking models don't burn their
# token budget on a scratchpad and reply with nothing.
ai:
  enabled: false                              # master switch; omit the whole block to disable
  base_url: "http://jetson.local:8080/v1"     # OpenAI-compatible API root (includes /v1)
  api_key: "op://my-vault/openai/token"       # optional; ${ENV:...}/op:// refs supported. Omit for auth-less local servers
  model: "qwen2.5:9b"                          # model name passed to the endpoint
  categories: true                            # let the model assign categories
  budgets: false                              # let the model assign budgets
  overwrite_existing: false                   # re-map noisy bank labels onto Firefly's taxonomy; never blanks a value, only replaces it with a better existing one
  always_ask_model: false                     # disable reuse-first: consult the model even when similar past transactions agree (they're still passed as examples)
  split_orders: true                          # when a vendor order's line_items span several categories, upload it as a Firefly split transaction (default true; only applies to vendors that emit line_items)
  max_examples: 5                             # similar past transactions used as context (default 5)
  timeout_seconds: 30                         # per-request timeout (default 30)

# ── Browser executable (required) ────────────────────────────────────────────
# macOS:
browser_exec_path: "/Applications/Brave Browser.app/Contents/MacOS/Brave Browser"
# Linux: browser_exec_path: "/usr/bin/brave-browser"

# ── Institutions ──────────────────────────────────────────────────────────────
# Institutions can also be loaded from external files with the !import tag:
#   institutions:
#     - !import "institutions/primary-bank.yaml"
#     - !import "institutions/brokerage.yaml"
# Or import the whole list: institutions: !import "institutions.yaml"
institutions:

  # ── Institution 1: Regular bank — demonstrates all regular-account features ─
  - name: "Example Bank"
    login:
      # navigate: go to the institution's login page
      - type: navigate
        url: "https://www.example-bank.example.com/login"

      # wait_visible: pause until element is present (CSS selector variant)
      - type: wait_visible
        selector: "#login-form"
      # wait_visible: JavaScript path variant (alternative to selector)
      # - type: wait_visible
      #   js_path: "document.querySelector('#login-form')"

      - type: sleep
        duration: "2s" # Go duration: "500ms", "2s", "1m30s"

      # send_keys: type into a field (triggers JS input/change events)
      # Option A — 1Password secret reference (recommended)
      - type: send_keys
        selector: "#username-input"
        value: "op://my-vault/example-bank/username"
      # Option B — hardcoded literal (not recommended for credentials)
      # - type: send_keys
      #   selector: "#username-input"
      #   value: "myusername"
      # Option C — js_path variant
      # - type: send_keys
      #   js_path: "document.querySelector('#username-input')"
      #   value: "op://my-vault/example-bank/username"

      - type: send_keys
        selector: "#password-input"
        value: "op://my-vault/example-bank/password"

      # click: click a DOM element (CSS selector variant)
      - type: click
        selector: "#signin-btn"
      # click: JavaScript path variant
      # - type: click
      #   js_path: "document.querySelector('#signin-btn')"

      # wait_not_visible: pause until element disappears (e.g., loading overlay)
      - type: wait_not_visible
        selector: "#loading-overlay"
      # wait_not_visible: JavaScript path variant
      # - type: wait_not_visible
      #   js_path: "document.querySelector('#loading-overlay')"

      # logout — OPTIONAL: sign the institution out of the browser after all
      # of its accounts have been synced (runs even if some accounts failed;
      # skipped when login failed). A failed logout logs a warning and never
      # fails the run. Omit to keep the session alive in the persistent
      # profile between runs (fastest for frequent syncs).
      # - type: click
      #   selector: "#account-menu"
      # - type: click
      #   selector: "#sign-out"
      # - type: wait_not_visible
      #   selector: "#login-form"

    accounts:

      # ── Credit card: single amount column with negate_if ─────────────────
      - name: "Example Credit Card"
        firefly_account_id: 1
        account_type: "regular"

        # balance: required for regular accounts; last step must be type "balance"
        balance:
          - type: navigate
            url: "https://www.example-bank.example.com/accounts"
          - type: wait_visible
            selector: "#card-summary"
          - type: sleep
            duration: "2s"
          # balance step — CSS selector variant: uses element's visible text
          - type: balance
            selector: "#credit-card-balance"
          # balance step — JavaScript evaluate variant (alternative to selector):
          # - type: balance
          #   evaluate: "document.querySelector('#credit-card-balance').innerText"
          # Note: numeric IDs need CSS escaping in selectors:
          # selector: "#\\31 234567-balance"  (for id="1234567-balance")

        # transactions: required for regular accounts; must contain at least one
        # "transactions" step. Multiple transactions steps are merged.
        transactions:
          - type: navigate
            url: "https://www.example-bank.example.com/accounts/credit-card"
          - type: wait_visible
            selector: "#transaction-export"
          # set_value: sets field value via JS .value property (no key events)
          # Option A — date template, CSS selector
          - type: set_value
            selector: "#start-date"
            value: '{{ SubtractDays 30 "01/02/2006" }}'
          # Option B — js_path variant
          # - type: set_value
          #   js_path: "document.querySelector('#start-date')"
          #   value: '{{ SubtractDays 30 "01/02/2006" }}'
          - type: set_value
            selector: "#end-date"
            value: '{{ Today "01/02/2006" }}'
          - type: click
            selector: "#download-csv-btn"
          - type: sleep
            duration: "5s"

          # transactions step — CSV mode, single amount column
          - type: transactions
            csv:
              options:
                delimiter: ","       # default; use "\t" for tab-separated
                skip_head_rows: 1    # skip 1 header row at top
                skip_tail_rows: 0    # skip N rows at bottom (e.g., totals)
                # skip_row_conditions: skip rows matching ANY condition
                skip_row_conditions:
                  # equals: exact case-sensitive match
                  - column: 1
                    operation: "equals"
                    value: "TOTAL"
                  # contains: substring match
                  - column: 2
                    operation: "contains"
                    value: "PENDING"
                  # starts_with: prefix match
                  - column: 2
                    operation: "starts_with"
                    value: "MEMO:"
                  # ends_with: suffix match
                  - column: 2
                    operation: "ends_with"
                    value: "(REVERSED)"
                  # empty: cell is blank or whitespace-only (no `value` field)
                  - column: 1
                    operation: "empty"
                  # not_empty: cell has at least one non-whitespace char (no `value`)
                  # - column: 6
                  #   operation: "not_empty"
              fields:
                # date: required; column is 1-based
                date:
                  column: 1
                  format: "01/02/2006" # MM/DD/YYYY; see Go time format reference
                  # Other common formats:
                  # format: "2006-01-02"          # ISO 8601 / YYYY-MM-DD
                  # format: "1/2/06"              # M/D/YY
                  # format: "January 2, 2006"     # Full month name
                  # format: "Jan 2, 2006"         # Abbreviated month
                # description: required
                description:
                  column: 2
                # category: optional; maps to Firefly category name
                category:
                  column: 3
                # amount: single column containing both positive and negative values
                amount:
                  column: 4
                  negate: false # set true to always multiply by -1
                  # negate_if: conditionally negate when ANY condition matches
                  negate_if:
                    - column: 5
                      operation: "contains"
                      value: "CR"

      # ── Checking account: debit/credit split columns, all negate_if ops ───
      - name: "Example Checking"
        firefly_account_id: 2
        account_type: "regular"

        balance:
          - type: navigate
            url: "https://www.example-bank.example.com/accounts"
          - type: wait_visible
            selector: "#checking-summary"
          # balance via JavaScript evaluate
          - type: balance
            evaluate: "document.querySelector('#checking-balance').innerText"

        transactions:
          - type: navigate
            url: "https://www.example-bank.example.com/accounts/checking"
          - type: wait_visible
            selector: "#history-section"
          - type: click
            selector: "#export-btn"
          - type: sleep
            duration: "5s"

          # transactions step — CSV mode, separate debit/credit columns
          - type: transactions
            csv:
              options:
                delimiter: ","
                skip_head_rows: 1
                skip_row_conditions:
                  - column: 1
                    operation: "empty"
              fields:
                date:
                  column: 1
                  format: "2006-01-02"
                description:
                  column: 2
                # debit + credit: mutually exclusive with `amount`; must use both
                debit:
                  column: 3
                  negate: false      # debits are negative by default; true to flip
                  negate_if:
                    - column: 5
                      operation: "equals"
                      value: "REVERSAL"
                credit:
                  column: 4
                  negate: false      # credits stay positive by default; true to negate
                  negate_if:
                    - column: 5
                      operation: "starts_with"
                      value: "FEE"

  # ── Institution 2: Credit union — Excel exports, reload step ──────────────
  - name: "Example Credit Union"
    login:
      - type: navigate
        url: "https://online.example-cu.example.com/login"
      - type: wait_visible
        selector: "#login-page"
      - type: send_keys
        selector: "#member-id"
        value: "op://my-vault/example-cu/username"
      - type: send_keys
        selector: "#passcode"
        value: "op://my-vault/example-cu/password"
      - type: click
        selector: "#submit-login"
      - type: wait_not_visible
        selector: "#login-page"
      # reload: refresh the current page (equivalent to pressing F5)
      - type: reload
      - type: wait_visible
        selector: "#dashboard"

    accounts:

      # ── Savings: Excel download, tab-delimited option shown in comment ─────
      - name: "Example Savings"
        firefly_account_id: 3
        account_type: "regular"

        balance:
          - type: navigate
            url: "https://online.example-cu.example.com/accounts"
          # wait_visible with js_path
          - type: wait_visible
            js_path: "document.querySelector('#savings-widget')"
          - type: balance
            selector: "#savings-available-balance"

        transactions:
          - type: navigate
            url: "https://online.example-cu.example.com/accounts/savings/history"
          - type: send_keys
            selector: "#from-date"
            value: '{{ SubtractDays 90 "2006-01-02" }}'
          - type: send_keys
            selector: "#to-date"
            value: '{{ Today "2006-01-02" }}'
          - type: click
            selector: "#download-excel-btn"
          - type: sleep
            duration: "8s"

          # transactions step — Excel mode
          - type: transactions
            excel:
              worksheet: 1        # 1-based sheet index (1 = first sheet)
              # password: "secret"  # optional; supports op:// secret refs e.g. op://vault/item/field
              options:
                skip_head_rows: 2 # skip two header rows
                skip_tail_rows: 1 # skip one totals row at bottom
                skip_row_conditions:
                  - column: 1
                    operation: "empty"
              fields:
                date:
                  column: 1
                  format: "2006-01-02"
                description:
                  column: 3
                amount:
                  column: 5
                  negate: true # flip sign for all rows in this file

      # ── Money market: tab-separated CSV, second worksheet example ─────────
      - name: "Example Money Market"
        firefly_account_id: 4
        account_type: "regular"

        balance:
          - type: navigate
            url: "https://online.example-cu.example.com/accounts"
          - type: wait_visible
            selector: "#mm-widget"
          - type: balance
            selector: "#mm-balance"

        transactions:
          - type: navigate
            url: "https://online.example-cu.example.com/accounts/money-market/export"
          - type: click
            selector: "#export-tsv-btn"
          - type: sleep
            duration: "5s"

          # tab-delimited CSV; skip_tail_rows to drop a summary row
          - type: transactions
            csv:
              options:
                delimiter: "\t"
                skip_head_rows: 1
                skip_tail_rows: 1
              fields:
                date:
                  column: 1
                  format: "01/02/2006"
                description:
                  column: 2
                amount:
                  column: 3

  # ── Institution 3: Investment / brokerage — all market prefixes ───────────
  - name: "Example Brokerage"
    login:
      - type: navigate
        url: "https://www.example-brokerage.example.com/"
      - type: wait_visible
        selector: "#auth-modal"
      - type: send_keys
        selector: "#email"
        value: "op://my-vault/example-brokerage/email"
      - type: send_keys
        selector: "#password"
        value: "op://my-vault/example-brokerage/password"
      # click using JavaScript path
      - type: click
        js_path: "document.querySelector('button[type=\"submit\"]')"
      # wait_not_visible using JavaScript path
      - type: wait_not_visible
        js_path: "document.querySelector('#auth-modal')"
      - type: sleep
        duration: "3s"

    accounts:

      # ── Multi-market portfolio: multiple holdings steps (results merged) ───
      - name: "Example Portfolio"
        firefly_account_id: 10
        account_type: "investment"

        # holdings: required for investment accounts; multiple steps are merged
        holdings:
          - type: navigate
            url: "https://www.example-brokerage.example.com/portfolio/positions"
          - type: wait_visible
            selector: "#positions-table"
          - type: sleep
            duration: "3s"

          # holdings step: JS must return { "symbol": quantity } object.
          # Market prefix key formats:
          #   "TICKER"                                    → Yahoo Finance stock
          #   "mi:fund-slug-us92202e6077"                 → Markets Insider fund
          #   "mc:MF_XXXXX"                               → MoneyControl mutual fund
          #   "gold:916"  (22k) / "gold:999" (24k)        → Kitco gold spot × purity
          #   "cash:USD"  (or any suffix)                 → always priced at 1
          - type: holdings
            evaluate: |
              (() => {
                const result = {};
                document.querySelectorAll('.position-row[data-symbol]').forEach(row => {
                  const symbol = row.dataset.symbol; // already in "PREFIX:value" format
                  const qty = parseFloat(
                    row.querySelector('.quantity').innerText.replace(/,/g, '')
                  );
                  if (symbol && !isNaN(qty)) result[symbol] = qty;
                });
                return result;
              })()

          # Second holdings step on a different page — results are merged with above
          - type: navigate
            url: "https://www.example-brokerage.example.com/portfolio/funds"
          - type: wait_visible
            selector: "#fund-holdings"
          - type: sleep
            duration: "2s"
          - type: holdings
            evaluate: |
              (() => {
                return {
                  // Plain ticker → Yahoo Finance
                  "AAPL": 50,
                  "MSFT": 25.5,
                  // Markets Insider fund (slug from businessinsider.com/funds/<slug>)
                  "mi:vanguard-target-retirement-2045-fund-us92202e6077": 120,
                  // MoneyControl mutual fund code
                  "mc:MF_000123": 45.67,
                  // 22k gold, quantity in grams (spot bid × 0.916)
                  "gold:916": 10.5,
                  // 24k gold, quantity in grams (spot bid × 0.999)
                  "gold:999": 5.0,
                  // Cash / money-market / private symbols — always priced at 1
                  "cash:USD": 5000,
                  "cash:401K-STABLE-VALUE": 12500
                };
              })()

  # ── Institution 4: Loaded from an external file ───────────────────────────
  - !import "institutions/another-institution.yaml"


# ── Vendors (optional, requires ai.enabled) ──────────────────────────────────
# All-in-one merchants produce charges whose category can't be inferred from the
# bank description alone — the same store might be pet supplies one week,
# medicine the next, household goods after that. Vendors solve this by pulling
# your order history from the merchant itself, using the same browser-step DSL
# as institutions, then matching each bank charge to an order by amount + date
# (within date_window_days).
#   • One matching order  → the model categorizes from the order's actual items
#     (the items are also written into the transaction's notes).
#   • No / multiple match → the charge is left uncategorized, and the reason is
#     logged so you can assign it in Firefly yourself.
# Vendor scraping only runs on demand: -vendors all  or  -vendors "Name,Other".
# To build a flow, -list-orders logs in, prints every scraped order, and exits
# without syncing anything — iterate on your `orders` JS until it looks right.
# 2FA tip: the browser profile persists in chromedp-data/, so complete any
# vendor 2FA challenge once by hand — later runs reuse the session.
vendors:

  - name: "Example Store"
    # Regex (case-insensitive) matched against a bank transaction's description
    # to route it to this vendor. Cover every form your statement uses.
    match: "EXAMPLE ?STORE|EXMPLSTR"
    # date_window_days: how many days a charge may post after (or before) the
    # order date and still match. Merchants that charge at shipment need a few
    # days of slack. Default 3; 0 = must be the same day.
    date_window_days: 3
    # date_format: Go layout of the dates your `orders` JS returns. When
    # omitted, common layouts are tried ("2006-01-02", "January 2, 2006",
    # "Jan 2, 2006", "01/02/2006", RFC3339).
    date_format: "2006-01-02"

    login:
      # The browser profile persists in chromedp-data/, so a previous run's
      # session is often still valid. Land on a page that requires auth, then
      # skip the credential steps unless you were bounced to the login page.
      - type: navigate
        url: "https://store.example.com/account/orders"
      - type: sleep
        duration: "4s"
      - type: skip_remaining_if
        evaluate: "!/login|signin/i.test(location.href)"
      - type: send_keys
        selector: "#email"
        value: "op://my-vault/example-store/username"
      - type: send_keys
        selector: "#password"
        value: "op://my-vault/example-store/password"
      - type: click
        selector: "button[type='submit']"
      # Leave slack for a manually-completed 2FA prompt on the first run.
      - type: sleep
        duration: "15s"

    # logout — OPTIONAL: sign the vendor out after the orders have been
    # scraped (runs on both -vendors and -list-orders). Same best-effort
    # semantics as the institution variant.
    # - type: click
    #   selector: "#account-menu"
    # - type: click
    #   selector: "#sign-out"

    orders:
      - type: navigate
        url: "https://store.example.com/account/orders"
      - type: wait_visible
        selector: ".order-row"
      - type: sleep
        duration: "3s"
      # The orders step's JS must return an array of
      #   { date: "...", amount: "...", items: "...", category: "...",
      #     line_items: [{ name: "...", amount: "..." }] }
      # `category` is optional — a merchant-provided department name that may
      # map directly onto a Firefly category, skipping a model call.
      #
      # `line_items` is optional but powerful: when a single order contains
      # items from different categories (pet supplies AND medicine), the charge
      # is uploaded as a Firefly SPLIT TRANSACTION with one split per category.
      # Line amounts are scaled proportionally so the splits always sum to the
      # amount actually billed — tax and fees included. Requires ai.split_orders
      # (default true); omit line_items to categorize each charge as a whole.
      #
      # Multiple orders steps accumulate, so you can page through order history.
      # Prefer stable anchors (data-* attributes, visible labels) over generated
      # CSS class names, which churn. Run -list-orders to see exactly what your
      # JS returns; with -debug the raw payload is logged too.
      - type: orders
        evaluate: |
          (() => {
            return [...document.querySelectorAll('.order-row')].map(row => {
              const lines = [...row.querySelectorAll('[data-item]')].map(el => ({
                name: el.querySelector('[data-item-name]')?.textContent.trim() ?? '',
                amount: el.querySelector('[data-item-price]')?.textContent.trim() ?? '',
              })).filter(li => li.name);
              return {
                date: row.querySelector('[data-order-date]')?.textContent.trim() ?? '',
                amount: row.querySelector('[data-order-total]')?.textContent.trim() ?? '',
                items: lines.map(li => li.name).join(', '),
                line_items: lines,
              };
            }).filter(o => o.date && o.amount);
          })()

      # ── Alternative: call the merchant's own API ────────────────────────────
      # Many order pages are SPAs backed by a JSON/GraphQL API. Calling it from
      # the page is far more robust than scraping rendered markup, and secret
      # references (op:// , bw://) are resolved anywhere inside the JS — so an
      # API token never has to sit in this file:
      #
      # - type: orders
      #   evaluate: |
      #     (async () => {
      #       const resp = await fetch('https://store.example.com/api/orders', {
      #         headers: { Authorization: 'Bearer op://my-vault/example-store/api-token' },
      #       });
      #       if (!resp.ok) throw new Error('orders API returned HTTP ' + resp.status);
      #       const data = await resp.json();
      #       return (data.orders ?? []).map(o => ({
      #         date: String(o.placedAt ?? '').split('T')[0],
      #         amount: String(o.total ?? ''),
      #         items: (o.lineItems ?? []).map(li => li.name).filter(Boolean).join(', '),
      #       })).filter(o => o.date && o.amount);
      #     })()
      #
      # Throwing inside the JS surfaces as a clear step error, which beats
      # silently returning an empty list when auth has expired.
